<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Daily Focus</h1>
      <p>Keep your mind calm and organized</p>
    </header>

    
    <form id="task-form" class="task-form">
      <input type="hidden" id="task-id">
      <div class="input-group">
        <input type="text" id="title" placeholder="Add a new task..." required>
        <select id="priority" required>
          <option value="" disabled selected>Priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit" id="submit-btn">Add</button>
      </div>
    </form>

    
    <ul id="task-list" class="task-list"></ul>
  </div>

  
  <div id="confirm-modal" class="modal-overlay">
    <div class="modal-card">
      <h3>Delete Task</h3>
      <p>Are you sure you want to delete this task?</p>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn-modal btn-cancel">Cancel</button>
        <button id="modal-confirm-btn" class="btn-modal btn-delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  
  <div id="toast" class="toast">Task deleted successfully!</div>

  <script src="app.js"></script>
</body>
</html>
